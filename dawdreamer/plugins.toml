# Free VST3 plugins for the DawDreamer engine (dawdreamer/specs/engine.md, Plugins).
#
# `uv run datapipe plugins fetch` downloads each archive for this OS, checks its sha256 and copies the
# named .vst3 bundle into dawdreamer/plugins/<os>/<key>/ (gitignored). Nothing is installed system-wide.
# A preset names a plugin by its key here. When the plugin is missing, the slot's `fallback` is used.
#
# Picked for: open source, VST3 on Windows and macOS, small, loads and renders headless in DawDreamer
# (tested on macOS arm64 with DawDreamer 0.9.0, 2026-10-22).
#
# Keys per OS: url, sha256, vst3 (the bundle name to copy out of the archive).
# `system = "<bundle>.vst3"` instead means "installed by hand", looked up in the OS's VST3 folders.

[ripplerx]
version = "1.5.19"
kind = "instrument"
license = "GPL-3.0"
about = "Physically modelled mallets, bars and membranes. Glassy bells, kalimba, marimba, vibes. 28 factory programs, set by name: Program = \"Crystal\"."
home = "https://github.com/tiagolr/ripplerx"
macos = { url = "https://github.com/tiagolr/ripplerx/releases/download/v1.5.19/ripplerx-macos-v1.5.19.zip", sha256 = "24189919de96d6e5a4b80343ab4b664dc7ad5f7f049a06336da34559e4ddddbe", vst3 = "RipplerX.vst3" }
windows = { url = "https://github.com/tiagolr/ripplerx/releases/download/v1.5.19/ripplerx-win-v1.5.19.zip", sha256 = "517c0e99f3ff37cf7b3941ed9afbece1423a0da69d70a9dd8076a473d630a50d", vst3 = "RipplerX.vst3" }

