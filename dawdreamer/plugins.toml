# Dragonfly: one archive, four reverbs. Use one Dragonfly per render: on macOS two of them in one process
# share Objective-C class names and print warnings (audio was unaffected in the test).
[dragonfly_plate]
version = "3.2.10"
kind = "effect"
license = "GPL-3.0"
about = "Plate reverb: bright, dense, short pre-delay. Good on plucks and claps."
