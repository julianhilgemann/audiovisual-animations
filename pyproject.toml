[project]
name = "datapipe"
version = "0.0.1"
description = "Audio-reactive YouTube Shorts rendered with Blender"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "scipy",
    "librosa>=0.11",
    "soundfile",
    # PyAV bundles the FFmpeg libraries, so no system ffmpeg is needed.
    # From 16 on its macOS wheels need macOS 14; capped on macOS so 13 (Ventura) machines get a wheel too.
    "av>=15.1,<16; sys_platform == 'darwin'",
    "av>=15.1; sys_platform != 'darwin'",
    "matplotlib",
    "dawdreamer>=0.9",  # headless audio graph: Faust, VST3 hosts, sampler (dawdreamer/)
    "mido",             # score.mid read and write
    "pyloudnorm",       # BS.1770 integrated loudness
]

[project.scripts]
datapipe = "datapipe.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
