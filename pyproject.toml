[project]
name = "datapipe"
version = "0.0.1"
description = "Audio-reactive YouTube Shorts rendered with Blender"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "scipy",
    "librosa>=0.11",
    "soundfile",
    "av",            # PyAV: bundles the FFmpeg libraries, so no system ffmpeg is needed
    "matplotlib",
]

[project.scripts]
datapipe = "datapipe.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datapipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
