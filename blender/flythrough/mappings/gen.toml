# Method A (gen): how a generated run drives the flythrough (blender/flythrough/README.md). The sources are the
# stem tunnel's (blender/stem-tunnel/mappings/gen.toml explains every kind of source); the look signals have the
# same names, so a recipe means the same on both looks and only what each signal drives differs (look.toml).
#
# kick moves the picture (zoom punch, roll jolt, speed burst, the escapement's tick); kick_light lights it (the
# lights and the glow), split so a hit can punch without flashing the whole frame, which `datapipe short`
# measures. The riser speeds the flight up; the twist section is the loop's violation, a hue jump and extra roll.
#
# Written in the canonical form (src/datapipe/recipe.py): the comment after each line comes from look.toml, so
# notes about this method belong up here.

ring = { track = "kick", level = 0.3 }  # a light launches into the tunnel on this track's hits, at this level

[signals]  # look signal = { source = weight }: the weighted sum of its sources, clamped to 0-1
kick       = { "hit:kick" = 1.0 }                         # zoom punch, roll jolt, speed burst, the escapement ticks the gears
kick_light = { "hit:kick" = 0.2 }                         # lights and glow pulse on the kick
bass       = { "stem:bass" = 1.0 }                        # the drive train turns, haze, roll
energy     = { "mix:loud" = 0.8, "curve:riser" = 0.4 }    # speed, lantern, glow, colour cycling
hats       = { "hit:hats" = 1.0 }                         # small gears whirr, streaks sparkle
mids       = { "hit:clap" = 0.8, "hit:lead" = 0.6 }       # dial rings, gates and crystal slabs turn
bright     = { "mix:bright" = 0.6, "curve:riser" = 0.6 }  # palette shift
twist      = { "section:twist" = 1.0 }                    # hue jump and extra camera roll

[smooth]  # moving average over this many frames, after the sources are summed
energy = 12
bright = 8

[hit]  # envelope per track, in frames: rise before the hit (anticipation), decay after
default = { windup = 0, decay = 8 }
kick    = { windup = 3, decay = 9 }
clap    = { windup = 0, decay = 14 }
hats    = { windup = 0, decay = 5 }
lead    = { windup = 0, decay = 8 }

[motion]
speed_curve  = "riser"  # the curve that speeds the flight up
speed_riser  = 3.0      # forward speed added by that curve, in the units of the look's speed sliders
roll_twist   = 1.5      # extra camera roll through the twist, same units as roll_idle
twist_hue    = 0.2      # hue jump through the twist (1 = once around the colour wheel)
section_ease = 15       # frames to ease a section signal in and out
