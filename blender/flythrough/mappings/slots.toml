# Method E (slots): any stems as numbered slots, no tempo, on the flythrough (SPEC §16.7). slot1 punches (zoom,
# jolt, the escapement's tick, the racing light), slot2 is the body (drive train, haze, roll), slot3 makes the
# small gears whirr and the streaks sparkle, slot4 turns the portals and its entry turns the palette; why each
# source: blender/stem-tunnel/mappings/slots.toml.
#
# Written in the canonical form (src/datapipe/recipe.py): the comment after each line comes from look.toml, so
# notes about this method belong up here.

ring = { track = "slot1", level = 0.15 }  # a light launches into the tunnel on this track's hits, at this level

[signals]  # look signal = { source = weight }: the weighted sum of its sources, clamped to 0-1
kick       = { "hit:slot1" = 1.0 }                                            # zoom punch, roll jolt, speed burst, the escapement ticks the gears
kick_light = { "hit:slot1" = 0.3 }                                            # lights and glow pulse on the kick
bass       = { "feature:slot2.loud" = 0.6, "feature:slot2.low" = 0.4 }        # the drive train turns, haze, roll
energy     = { "curve:energy" = 0.8, "feature:slot1.density" = 0.3 }          # speed, lantern, glow, colour cycling
hats       = { "hit:slot3" = 0.7, "feature:slot3.high" = 0.4 }                # small gears whirr, streaks sparkle
mids       = { "feature:slot4.loud" = 0.6, "feature:slot2.transient" = 0.4 }  # dial rings, gates and crystal slabs turn
bright     = { "mix:bright" = 0.6, "feature:slot3.flat" = 0.3 }               # palette shift
twist      = { "feature:slot4.active" = 1.0 }                                 # hue jump and extra camera roll

[smooth]  # moving average over this many frames, after the sources are summed
energy = 12
bright = 8
twist  = 30

[hit]  # envelope per track, in frames: rise before the hit (anticipation), decay after
default = { windup = 0, decay = 8 }
slot1   = { windup = 2, decay = 9 }
slot3   = { windup = 0, decay = 5 }

[motion]
roll_twist = 1.0   # extra camera roll through the twist, same units as roll_idle
twist_hue  = 0.15  # hue jump through the twist (1 = once around the colour wheel)
