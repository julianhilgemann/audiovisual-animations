# Style "speed_rails": long rows of rails down a round tunnel, a thin frame every second row and a helix shell:
# the lines stream past, so speed reads at once.

[shape]  # rebuilds the tunnel's geometry
# Cells
symmetry   = 12   # Cells around
cell_depth = 3.0  # Cell length
# Patterns
walls         = "rails"  # Walls (maze, grid, diamonds, chevrons, hexes, circuit, stripes, rails, zigzag, truchet, dots, none)
portals       = "frame"  # Portals (crenel, rings, spokes, teeth, triple, frame, none)
portal_every  = 2        # Portal every
outer_pattern = "helix"  # Outer shell (ladder, rails, helix, grid, dots, none)

[look]  # live: the sliders on NeonControls
# Glow and colour
hue_depth   = 0.6  # Rainbow along depth
wave_amount = 0.5  # Brightness wave
