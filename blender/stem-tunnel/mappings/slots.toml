# Method E (slots): any stems, no instrument names, no tempo (SPEC §16.7). Each stem is a slot: slot1, slot2, ... in
# the order song.toml `slots = ["File A", "File B"]` lists them, then by file name. Every slot has the same generic
# features, `feature:slot<N>.<name>` (loud, transient, density, crest, bright, flat, low, mid, high, active), and
# its transients as hits, `hit:slot<N>`. The mapping is by slot, so put the stem that should punch first:
#   slot1 punches (zoom, jolt, squeeze, the light ring), slot2 is the body (walls breathe, outer shell, haze, roll),
#   slot3 sparkles, slot4 spins the portals and its entry turns the palette. The whole mix sets glow and colour:
#   its slow level (curve:energy, 3 s), not its frame loudness, so a loud transient doesn't light the frame late.
#
# The light ring races into the tunnel on slot 1's transients. It is brightest about 3 frames after the hit (it
# starts beside the camera), so on sparse transients without a beat it lit the frame late: measured on the
# texture fixture, ring 0.3 with kick_light 0.2 put the brightness peak 3 frames after the hits; ring 0.15 with
# kick_light 0.3, on them. bright follows a brighter, noisier sound; the twist (hue shift, extra roll) is
# slot 4 playing, eased over half a second.
#
# Written in the tuner's form (`datapipe tune`, Save as method default): the comment after each line comes
# from look.toml, so notes about this method belong up here.

ring = { track = "slot1", level = 0.15 }  # the light ring races into the tunnel on this track's hits, at this level

[signals]  # look signal = { source = weight }: the weighted sum of its sources, clamped to 0-1
kick       = { "hit:slot1" = 1.0 }                                            # zoom punch, roll jolt, portal squeeze, wall pump, forward burst
kick_light = { "hit:slot1" = 0.3 }                                            # glow and bloom on the kick
bass       = { "feature:slot2.loud" = 0.6, "feature:slot2.low" = 0.4 }        # walls breathe, outer shell swells, haze, roll
energy     = { "curve:energy" = 0.8, "feature:slot1.density" = 0.3 }          # base glow, bloom, forward speed, colour cycling
hats       = { "hit:slot3" = 0.7, "feature:slot3.high" = 0.4 }                # sparkle wave, outer shell spin
mids       = { "feature:slot4.loud" = 0.6, "feature:slot2.transient" = 0.4 }  # portal spin
bright     = { "mix:bright" = 0.6, "feature:slot3.flat" = 0.3 }               # palette shift
twist      = { "feature:slot4.active" = 1.0 }                                 # hue jump and extra camera roll

[smooth]  # moving average over this many frames, after the sources are summed
energy = 12
bright = 8
twist  = 30

[hit]  # envelope per track, in frames: rise before the hit (anticipation), decay after
default = { windup = 0, decay = 8 }
slot1   = { windup = 2, decay = 9 }
slot3   = { windup = 0, decay = 5 }

[motion]
roll_twist = 1.0   # extra camera roll through the twist, same units as roll_idle
twist_hue  = 0.15  # hue jump through the twist (1 = once around the colour wheel)
